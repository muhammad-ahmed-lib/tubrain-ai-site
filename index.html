<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tube Brain AI - YouTube Analytics Platform</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            width: 100%;
            min-height: 100vh;
            background-color: #0F0F0F;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        #loading-screen {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: #0F0F0F;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            transition: opacity 0.8s ease;
        }
        #loading-screen.fade-out { opacity: 0; pointer-events: none; }
        .loading-logo { font-size: 64px; margin-bottom: 24px; animation: pulse 1.5s ease-in-out infinite; }
        .loading-title { font-size: 32px; font-weight: 800; color: #ffffff; margin-bottom: 8px; }
        .loading-subtitle { font-size: 14px; color: #9E9E9E; margin-bottom: 32px; }
        .loading-status { font-size: 12px; color: #FF6B35; margin-bottom: 16px; min-height: 20px; }
        .loading-bar { width: 200px; height: 4px; background: #1A1A2E; border-radius: 2px; overflow: hidden; }
        .loading-bar-fill { height: 100%; width: 0%; background: linear-gradient(90deg, #FF0000, #FF6B35); border-radius: 2px; transition: width 0.3s ease; }
        @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.1); } }
        canvas { width: 100% !important; height: 100vh !important; }
    </style>
</head>
<body>

<div id="loading-screen">
    <div class="loading-logo">🧠</div>
    <div class="loading-title">Tube Brain AI</div>
    <div class="loading-subtitle">Data-Driven Insights for Content Creators</div>
    <div class="loading-status" id="loading-status">Initializing...</div>
    <div class="loading-bar">
        <div class="loading-bar-fill" id="loading-bar-fill"></div>
    </div>
</div>

<script>
    const statusEl = document.getElementById('loading-status');
    const barEl = document.getElementById('loading-bar-fill');

    function setProgress(percent, message) {
        barEl.style.width = percent + '%';
        statusEl.textContent = message;
    }

    function hideLoadingScreen() {
        const loadingScreen = document.getElementById('loading-screen');
        if (loadingScreen) {
            loadingScreen.classList.add('fade-out');
            setTimeout(function () { loadingScreen.style.display = 'none'; }, 800);
        }
    }

    function waitForApp() {
        const observer = new MutationObserver(function() {
            const canvas = document.querySelector('canvas');
            if (canvas) {
                observer.disconnect();
                setProgress(100, 'Ready!');
                setTimeout(hideLoadingScreen, 500);
            }
        });
        observer.observe(document.body, { childList: true, subtree: true });
        setTimeout(hideLoadingScreen, 30000);
    }

    function loadScript(src, progressPercent, message) {
        return new Promise((resolve, reject) => {
            setProgress(progressPercent, message);
            const script = document.createElement('script');
            script.src = src;
            script.onload = resolve;
            script.onerror = () => {
                // If file not found, skip and continue
                console.warn('Could not load: ' + src + ' (skipping)');
                resolve();
            };
            document.body.appendChild(script);
        });
    }

    (async () => {
        try {
            setProgress(10, 'Loading resources...');
            await loadScript('downloader.js', 30, 'Loading downloader...');
            await loadScript('skiko.js', 50, 'Loading graphics engine...');
            setProgress(70, 'Starting app...');
            waitForApp();
            await loadScript('composeApp.js', 90, 'Loading app...');
        } catch (e) {
            statusEl.textContent = 'Error loading. Please refresh.';
            statusEl.style.color = '#FF0000';
        }
    })();
</script>

</body>
</html>
